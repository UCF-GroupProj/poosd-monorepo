openapi: 3.1.0
info:
  title: POOSD - Group 1
  contact:
    url: https://github.com/UCF-GroupProj/poosd-monorepo
  version: '1.0.0'
servers:
  - url: http://localhost:8080
  - url: https://api.poosd.zhiyan114.com
tags:
  - name: Auth
    description: Credential Management Endpoint
  - name: Password Reset
    description: Password Reset Endpoint
  - name: Email Verification
    description: Email Verification Endpoint
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        '401':
          description: Invalid credentials
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Account Not Enabled
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
  /register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: User registered successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Malformed Body
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: Duplicate Records (such as email)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
  /pwdreset/{ResetCode}:
    parameters:
      - name: ResetCode
        in: path
        required: true
        schema:
          type: string
        description: Password reset code
    get:
      tags:
        - Password Reset
      summary: Get password reset status or info
      responses:
        '200':
          description: Password reset information retrieved successfully
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "{userID}"
        '404':
          description: Provided Reset Code not found
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "No valid password request found with this code"
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Server error"
        '503':
          description: Service unavailable
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Database is experiencing issues"
    patch:
      tags:
        - Password Reset
      summary: Complete password reset by updating the password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Malformed Body or invalid token
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Invalid/Expired Request Token
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
  /pwdreset:
    post:
      tags:
        - Password Reset
      summary: Initiate a password reset request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password Reset Request Submitted
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Verification email has been sent, if there's an account associated with this email"
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Server error"
        '503':
          description: Service unavailable
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Database is experiencing issues"
  /verifyemail/{verifyCode}:
    parameters:
      - name: verifyCode
        in: path
        required: true
        schema:
          type: string
        description: Email Verification Code
    get:
      tags:
        - Email Verification
      summary: Get email verification status or info
      responses:
        '200':
          description: Email verification information retrieved successfully
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "{userID}"
        '404':
          description: verifyCode invalid
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Provided verification code was not found"
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Generic backend error"
        '503':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Database communication error"
    patch:
      tags:
        - Email Verification
      summary: Complete email verification by updating the verification status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Email verification token
      responses:
        '200':
          description: Email verified successfully
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Expired/Invalid token
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Generic Server Error"
        '503':
          description: Service Unavailable
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Database Communication Error"
  /verifyemail:
    post:
      tags:
        - Email Verification
      summary: Re-request email verification link
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Email Verification Request Submitted Request Submitted
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "An email verification link has been resent"
        '401':
          description: Invalid JWT Token
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Invalid account token to submit this request"
        '422':
          description: Account ineligible to submit this request
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Your account is already verified, request cannot be submitted again"
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Server error"
        '503':
          description: Service unavailable
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "Database is experiencing issues"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT